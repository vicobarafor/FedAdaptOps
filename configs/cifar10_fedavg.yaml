project:
  name: FedAdaptOps
  run_name: cifar10_phase2_fedavg
  output_dir: runs

seed: 42

data:
  dataset: CIFAR10
  data_dir: data
  num_clients: 20
  dirichlet_alpha: 0.3
  min_samples_per_client: 50
  batch_size: 64
  num_workers: 2

model:
  name: SimpleCNN
  num_classes: 10

federation:
  num_rounds: 3
  clients_per_round: 5
  dropout_probability: 0.0
  aggregation: sample_weighted

client_training:
  local_epochs: 1
  lr: 0.001
  weight_decay: 0.0001
  max_batches_per_client: 20

evaluation:
  eval_every_round: 1
  max_eval_batches: 50

training:
  device: auto

artifacts:
  save_checkpoint: true
  save_environment: true
