project:
  name: FedAdaptOps
  run_name: cifar10_phase3_personalization
  output_dir: runs

seed: 42

data:
  dataset: CIFAR10
  data_dir: data
  num_clients: 20
  dirichlet_alpha: 0.3
  min_samples_per_client: 50
  batch_size: 64
  num_workers: 2
  validation_fraction: 0.2

model:
  name: SimpleCNN
  num_classes: 10

personalization:
  policies:
    - head_only
    - partial_finetune
    - full_finetune
  clients_limit: 8
  local_epochs: 1
  lr: 0.001
  weight_decay: 0.0001
  max_train_batches_per_client: 10
  max_eval_batches_per_client: 10
  checkpoint_path: null

training:
  device: auto

artifacts:
  save_environment: true
